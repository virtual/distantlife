{% extends "layout.html" %}
{% from "./macros.html" import csrf_field with context %}
{% block title %}Admin — Upload Vocabulary{% endblock %}
{% block main %}
<h1>Upload Vocabulary</h1>
<p class="lead">Upload a CSV to add vocabulary to a set.</p>

<form class="mx-auto centered" action="/admin/upload/" method="post" enctype="multipart/form-data">
  {{ csrf_field() }}
  <fieldset>
    <legend>Upload words via CSV</legend>

    <div class="form-group">
      <label for="word_set_id">Target set</label>
      <select id="word_set_id" name="word_set_id" required>
        <option value="" selected disabled>Choose a set</option>
        {% for set in sets %}
          <option value="{{ set.id }}">{{ set.set_name }} (#{{ set.id }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="file">CSV file</label>
      <input id="file" type="file" name="file" accept=".csv" required>
    </div>

    <div class="form-group">
      <label for="additional_set">Add first column to additional set</label>
      <select id="additional_set" name="additional_set">
        <option value="" selected>---------</option>
        {% for set in sets %}
          <option value="{{ set.id }}">{{ set.set_name }} (#{{ set.id }})</option>
        {% endfor %}
      </select>
    </div>
  </fieldset>

  <div style="margin-top: 12px;">
    <button type="submit">Upload</button>
    <a href="/admin/">Back to admin</a>
  </div>
</form>
{% endblock %}

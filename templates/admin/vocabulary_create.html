{% extends "layout.html" %}
{% from "./macros.html" import csrf_field with context %}
{% block title %}Admin — Create Vocabulary{% endblock %}
{% block main %}
<h1>Create Vocabulary</h1>

<form method="post" action="/admin/vocabulary/create/">
  {{ csrf_field() }}
  <div>
    <label for="lemma_value">Primary form</label><br>
    <input id="lemma_value" name="lemma_value" type="text" required>
  </div>

  <div>
    <label for="vocalization">Vocalization</label><br>
    <input id="vocalization" name="vocalization" type="text" value="{{ vocalization or '' }}" placeholder="Optional vocalized form">
  </div>

  <div>
    <label for="definition">Definition</label><br>
    <textarea id="definition" name="definition" rows="4">{{ definition or '' }}</textarea>
  </div>

  <div>
    <label for="language_id">Language</label><br>
    <select id="language_id" name="language_id" required>
      <option value="">Choose language</option>
      {% for language in languages %}
      <option value="{{ language['id'] }}">{{ language['name'] }}{% if language['charcode'] %} ({{ language['charcode'] }}){% endif %}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label for="pos_id">Part of Speech</label><br>
    <select id="pos_id" name="pos_id" required>
      <option value="">Choose part of speech</option>
      {% for pos in pos_options %}
      <option value="{{ pos['id'] }}">{{ pos['type'] }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label for="state">Status</label><br>
    <select id="state" name="state">
      {% for st in state_options %}
      <option value="{{ st }}" {% if st == 'draft' %}selected="selected"{% endif %}>{{ st }}</option>
      {% endfor %}
    </select>
  </div>

  {% if has_image %}
  <div>
    <label for="image_path">Image Path</label><br>
    <input id="image_path" name="image_path" type="text" placeholder="/files/...">
  </div>
  {% endif %}

  <div class="admin-form-actions">
    <button type="submit">Create</button>
    <a href="/admin/vocabulary/">Back to list</a>
  </div>
</form>
{% endblock %}

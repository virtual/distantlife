{% extends "layout-1col.html" %}

{% block title %}
{{ _('ui.error.title') }}
{% endblock %}

{% block main %}
<!-- goBack action handled by global main.js via data-action="go-back" -->
    <p class="text-center">
      <span class=" fad fa-transporter-empty icon-xxl"></span>
      <span class="sr-only">transporter-empty</span>
    </p>
    <p class="text-center lead"><strong>{{ _('ui.error.title') }} {{ code }}</strong><br/> {{ message }}</p>
    <p class="text-center mt-5"><a class="btn btn-primary" data-action="go-back">{{ _('ui.go_back') }}</a></p>
{% endblock %}
